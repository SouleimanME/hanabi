# Projet dbt de l'entrepôt Hanabi, en trois couches dans la base de l'application.
#
#   bronze  vues sur les tables de `public`, sans transformation
#   silver  données nettoyées et conformées, règles métier écrites une fois
#   gold    tables d'agrégats, une par question, seule couche lue par le back-office
#
# Préfixes de modèles (brz_, slv_, gold_) : la couche se lit dans les plans et les erreurs.
name: hanabi_dwh
version: "1.0.0"
config-version: 2

profile: hanabi_dwh

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Droits de lecture reposés à chaque construction : une table recréée perd les siens
on-run-end:
  - "{{ accorde_lecture() }}"

models:
  hanabi_dwh:
    bronze:
      +schema: bronze
      +materialized: view
    silver:
      +schema: silver
      +materialized: view
    gold:
      +schema: gold
      +materialized: table

vars:
  # Identique à REVENUE_STATUSES dans hanabi-back/app/analytics.py
  statuts_ca: ["paid", "shipped", "delivered"]
  # Fenêtre de vitesse d'écoulement, comme `catalogue()` côté API
  fenetre_velocite_jours: 90
