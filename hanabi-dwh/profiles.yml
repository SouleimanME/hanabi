# Connexion de dbt, entièrement lue dans l'environnement.
#
# `dwh.py` pose les variables `DWH_*` à partir de `DATABASE_URL`. Sans lui, les
# valeurs par défaut visent le PostgreSQL jetable du README.

hanabi_dwh:
  target: "{{ env_var('DWH_TARGET', 'dev') }}"
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DWH_HOST', 'localhost') }}"
      port: "{{ env_var('DWH_PORT', '5433') | int }}"
      user: "{{ env_var('DWH_USER', 'postgres') }}"
      password: "{{ env_var('DWH_PASSWORD', 'hanabi') }}"
      dbname: "{{ env_var('DWH_DBNAME', 'hanabi') }}"
      # Repli seulement : chaque couche impose son schéma
      schema: public
      # TLS pour Neon, `prefer` pour un conteneur local (choisi par dwh.py)
      sslmode: "{{ env_var('DWH_SSLMODE', 'prefer') }}"
      # Connexions simultanées limitées sur le plan gratuit de Neon
      threads: 4
      # Laisse le temps au réveil de Neon
      connect_timeout: 30
