version: 2

models:
  - name: brz_clients
    description: Comptes clients, sans le condensat de mot de passe.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: email
        tests: [unique, not_null]

  - name: brz_produits
    description: Catalogue, sans les visuels.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: code
        tests: [unique, not_null]
      - name: price_cents
        tests: [not_null]

  - name: brz_commandes
    description: En-tetes de commande, tous statuts confondus.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: number
        tests: [unique, not_null]
      - name: user_id
        # Nullable a dessein : une commande invitee n'est rattachee a aucun
        # compte. Le test de relation ignore les NULL, il verifie seulement
        # qu'un identifiant renseigne designe bien un client existant.
        tests:
          - relationships:
              arguments:
                to: ref('brz_clients')
                field: id

  - name: brz_lignes_commande
    description: Lignes de commande, prix et cout figes a l'achat.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_commandes')
                field: id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_produits')
                field: id
      - name: qty
        tests: [not_null]

  - name: brz_vues_produit
    description: Consultations de fiche, une ligne par ouverture.
    columns:
      - name: id
        tests: [unique, not_null]
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('brz_produits')
                field: id

  - name: brz_avis
    columns:
      - name: id
        tests: [unique, not_null]
      - name: rating
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: brz_promos
    columns:
      - name: id
        tests: [unique, not_null]
      - name: code
        tests: [unique, not_null]
      - name: kind
        tests:
          - accepted_values:
              arguments:
                values: ["percent", "fixed", "free_shipping"]
