<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F0E6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15130F" media="(prefers-color-scheme: dark)" />

    <title>Hanabi 花火 · Objets japonais choisis</title>
    <meta
      name="description"
      content="Une sélection resserrée d'objets japonais, renouvelée par petites séries. Compagnons, tradition, collection."
    />

    <meta property="og:site_name" content="Hanabi" />
    <meta property="og:title" content="Hanabi 花火 · Objets japonais choisis" />
    <meta
      property="og:description"
      content="Une sélection resserrée d'objets japonais, renouvelée par petites séries."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hanabi-boutique.netlify.app/" />
    <!-- L'apercu partage exige une URL absolue : les reseaux sociaux recuperent
         l'image depuis leurs propres serveurs, sans contexte de page, et un
         chemin relatif ne mene alors nulle part. Le favicon qui tenait ce role
         etait de surcroit un SVG, format qu'aucune plateforme ne rend. -->
    <meta property="og:image" content="https://hanabi-boutique.netlify.app/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Page d'accueil de la boutique Hanabi" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Polices : preconnect + link plutot qu'un @import CSS, qui creerait
         une requete en cascade (CSS -> CSS -> police) au premier rendu.

         Les familles reelles sont declarees une seule fois, dans les jetons
         --font-* de src/index.css. Seuls les graisses effectivement utilisees
         sont demandees : chaque graisse d'une police japonaise pese lourd. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
