<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#efe7d6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0605" media="(prefers-color-scheme: dark)" />

    <title>Hanabi 花火 · Objets japonais choisis</title>
    <meta
      name="description"
      content="Douze objets japonais choisis un par un, renouvelés par petites séries."
    />

    <meta property="og:site_name" content="Hanabi" />
    <meta property="og:title" content="Hanabi 花火 · Objets japonais choisis" />
    <meta
      property="og:description"
      content="Douze objets japonais choisis un par un, renouvelés par petites séries."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hanabi-6x9.pages.dev/" />
    <!-- Les reseaux sociaux recuperent l'apercu sans contexte de page : l'URL
         doit etre absolue, et l'image un format matriciel. -->
    <meta property="og:image" content="https://hanabi-6x9.pages.dev/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Page d'accueil de la boutique Hanabi" />
    <meta property="og:locale" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Polices servies par le site (src/styles/fonts.css). Les deux fichiers du
         premier écran partent avant la feuille de style : pas de texte qui saute. -->
    <link
      rel="preload"
      href="/fonts/manrope-400-800-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/shippori-700-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Photos du catalogue : la connexion au CDN s'ouvre pendant le chargement du script -->
    <link rel="preconnect" href="https://images.unsplash.com" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
