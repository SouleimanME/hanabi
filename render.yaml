# Blueprint Render de l'API (New > Blueprint). Voir DEPLOY.md.
# Le front est hébergé à part, sur Cloudflare Pages.

services:
  - type: web
    name: hanabi-api
    runtime: python
    plan: free
    rootDir: hanabi-back

    # Le modèle de recherche est téléchargé au build (révision figée, empreintes
    # vérifiées) : le démarrage n'attend pas 120 Mo venus du réseau
    buildCommand: pip install -r requirements.txt && python -m app.plongement
    # 0.0.0.0 et $PORT imposés par Render.
    # --forwarded-allow-ips : l'IP réelle vient du proxy de Render dans
    # X-Forwarded-For ; sans lui, toutes les requêtes comptent pour une seule IP
    # et la limitation de débit est inopérante. « * » n'est sûr que parce que
    # seul le proxy de Render joint le conteneur.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'

    healthCheckPath: /health

    envVars:
      # SECRET_KEY devient obligatoire
      - key: ENV
        value: prod

      # Tirée par Render, jamais dans le dépôt
      - key: SECRET_KEY
        generateValue: true

      - key: PYTHON_VERSION
        value: "3.13"

      # `sync: false` : valeurs saisies dans le tableau de bord Render.

      # URL exacte du front, protocole compris (https://hanabi-6x9.pages.dev)
      - key: CORS_ORIGINS
        sync: false

      # Chaîne de connexion directe Neon (pas « pooled » : le fuseau UTC de
      # session serait perdu). Sans elle, SQLite éphémère dans le conteneur.
      - key: DATABASE_URL
        sync: false

      # Assistant de fiche produit : sans ces trois variables, il n'apparaît pas
      - key: REDACTION_URL
        sync: false
      - key: REDACTION_CLE
        sync: false
      - key: REDACTION_MODELE
        sync: false

      # Sans ces deux variables, aucun administrateur n'est créé
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
