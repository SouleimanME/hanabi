# Reconstruction quotidienne de l'entrepôt.
#
# Le graphe Dagster (hanabi-dwh/orchestration/) porte l'ordre des étapes ; ce
# fichier ne donne que l'heure, faute de daemon Dagster hébergé.
#
# Inactif sans le secret `DWH_DATABASE_URL` (chaîne de connexion directe Neon,
# sans -pooler) : Settings > Secrets and variables > Actions. Ce secret confie
# une connexion en écriture à GitHub Actions ; sur des données réelles, utiliser
# un rôle limité à la lecture de `public` et à l'écriture dans l'entrepôt.

name: Entrepot

on:
  schedule:
    # 5 h UTC, comme orchestration/planification.py
    - cron: "0 5 * * *"
  workflow_dispatch:

# Pas deux constructions simultanées sur les mêmes tables
concurrency:
  group: entrepot
  cancel-in-progress: false

jobs:
  construire:
    name: Materialiser le graphe
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-dwh

    steps:
      - uses: actions/checkout@v7

      # Secret absent (fork) : arrêt en vert. Secret mal formé : erreur explicite.
      # La valeur n'est jamais affichée.
      - name: Verifier que la base est configuree
        id: garde
        env:
          DWH_DATABASE_URL: ${{ secrets.DWH_DATABASE_URL }}
        run: |
          case "$DWH_DATABASE_URL" in
            "")
              echo "configure=false" >> "$GITHUB_OUTPUT"
              echo "::notice::Secret DWH_DATABASE_URL absent : reconstruction ignorée." \
                   "Voir l'en-tête de .github/workflows/entrepot.yml pour l'activer."
              ;;
            postgres://*|postgresql://*)
              echo "configure=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Le secret DWH_DATABASE_URL ne commence pas par" \
                   "postgresql://. Il attend la chaîne de connexion directe de Neon" \
                   "(format « Connection string »), pas des paramètres séparés ni un" \
                   "extrait de code. L'hôte ne doit pas contenir -pooler."
              exit 1
              ;;
          esac

      - uses: actions/setup-python@v7
        if: steps.garde.outputs.configure == 'true'
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hanabi-dwh/requirements.txt

      - name: Installer les dependances
        if: steps.garde.outputs.configure == 'true'
        run: pip install -r requirements.txt

      # Produit target/manifest.json, dont Dagster tire le graphe
      - name: Compiler le projet dbt
        if: steps.garde.outputs.configure == 'true'
        env:
          DWH_DATABASE_URL: ${{ secrets.DWH_DATABASE_URL }}
        run: python dwh.py parse

      # Non bloquant : une source périmée signale une ingestion arrêtée
      - name: Fraicheur des sources
        if: steps.garde.outputs.configure == 'true'
        continue-on-error: true
        env:
          DWH_DATABASE_URL: ${{ secrets.DWH_DATABASE_URL }}
        run: python dwh.py source freshness

      # Deux extractions puis les 27 modèles construits et testés dans l'ordre du
      # graphe. La partition du mois en cours rattrape les cotations manquantes.
      - name: Materialiser le graphe
        if: steps.garde.outputs.configure == 'true'
        env:
          DWH_DATABASE_URL: ${{ secrets.DWH_DATABASE_URL }}
        run: |
          dagster asset materialize \
            --module-name orchestration \
            --select '*' \
            --partition "$(date -u +%Y-%m-01)"

      # Conservés même en cas d'échec, pour lire le résultat de chaque nœud
      - name: Conserver les artefacts dbt
        if: always() && steps.garde.outputs.configure == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: dbt-target-${{ github.run_number }}
          path: |
            hanabi-dwh/target/manifest.json
            hanabi-dwh/target/run_results.json
            hanabi-dwh/target/sources.json
          retention-days: 30
          if-no-files-found: warn
