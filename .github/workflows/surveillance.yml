# Surveillance de /health, une fois par heure.
#
# Render endort le service après quinze minutes : la sonde le réveille d'abord,
# puis mesure. Une sonde plus fréquente le garderait éveillé et consommerait
# l'allocation gratuite. Alerte : tâche en échec et courriel de GitHub.
# Les tâches planifiées de GitHub prennent du retard et se désactivent après
# soixante jours sans activité.

name: Surveillance

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  sonde:
    name: Sonde de sante
    runs-on: ubuntu-latest

    steps:
      # Sans le secret API_HEALTH_URL, la tâche passe sans rien faire
      - name: Interroger la sonde
        env:
          URL: ${{ secrets.API_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::API_HEALTH_URL n'est pas configuré : surveillance inactive."
            exit 0
          fi

          # 1. Réveil, résultat ignoré
          debut=$(date +%s)
          curl -sS --max-time 120 -o /dev/null "$URL" || true
          reveil=$(( $(date +%s) - debut ))
          echo "Réveil : ${reveil}s"

          # 2. Mesure. curl écrit déjà 000 si la connexion échoue : pas de repli.
          rm -f corps.txt
          code=$(curl -sS --max-time 10 -o corps.txt -w '%{http_code}' "$URL") || true
          code=${code:-000}
          corps=$(cat corps.txt 2>/dev/null || true)

          echo "Code HTTP : $code"
          echo "Réponse   : $corps"

          if [ "$code" = "000" ]; then
            echo "::error::API injoignable, même après un réveil de ${reveil}s."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::La sonde répond $code. La base est probablement injoignable."
            exit 1
          fi

          # 200 avec status degrade : courriels abandonnés en file
          if echo "$corps" | grep -q '"status":"degrade"'; then
            echo "::error::Service dégradé : $corps"
            exit 1
          fi

          echo "::notice::Service en bonne santé (réveil ${reveil}s)."
