# Surveillance de /health, à la demande seulement.
#
# Depuis le 2026-09-30, l'API Hanabi n'est plus gardée éveillée : le Worker
# hanabi-reveil réveille le serveur de la boutique. Une sonde horaire réveillerait
# l'API à chaque passage et userait les heures gratuites de Render que la boutique
# consomme : elle ne se lance plus qu'à la main (Actions, Surveillance, Run workflow).
# Ce contrôle du réveil ne s'active qu'avec la variable de dépôt REVEIL_ACTIF à true.

name: Surveillance

on:
  workflow_dispatch:

concurrency:
  group: surveillance
  cancel-in-progress: false

jobs:
  sonde:
    name: Sonde de sante
    runs-on: ubuntu-latest

    steps:
      # Sans le secret API_HEALTH_URL, la tâche passe sans rien faire
      - name: Interroger la sonde
        env:
          URL: ${{ secrets.API_HEALTH_URL }}
          REVEIL_ACTIF: ${{ vars.REVEIL_ACTIF }}
        run: |
          if [ -z "$URL" ]; then
            echo "::notice::API_HEALTH_URL n'est pas configuré : surveillance inactive."
            exit 0
          fi

          # 1. Réveil, résultat ignoré
          debut=$(date +%s)
          curl -sS --max-time 120 -o /dev/null "$URL" || true
          reveil=$(( $(date +%s) - debut ))
          echo "Réveil : ${reveil}s"

          # 2. Mesure. curl écrit déjà 000 si la connexion échoue : pas de repli.
          rm -f corps.txt
          code=$(curl -sS --max-time 10 -o corps.txt -w '%{http_code}' "$URL") || true
          code=${code:-000}
          corps=$(cat corps.txt 2>/dev/null || true)

          echo "Code HTTP : $code"
          echo "Réponse   : $corps"

          if [ "$code" = "000" ]; then
            echo "::error::API injoignable, même après un réveil de ${reveil}s."
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::La sonde répond $code. La base est probablement injoignable."
            exit 1
          fi

          # 200 avec status degrade : courriels abandonnés en file
          if echo "$corps" | grep -q '"status":"degrade"'; then
            echo "::error::Service dégradé : $corps"
            exit 1
          fi

          # Une API éveillée répond en une ou deux secondes ; au-delà de vingt,
          # elle dormait : le Worker de réveil ne passe plus
          if [ "$REVEIL_ACTIF" = "true" ] && [ "$reveil" -ge 20 ]; then
            echo "::error::L'API dormait (${reveil}s pour répondre) : le réveil Cloudflare" \
                 "ne fonctionne plus. Voir DEPLOY.md, « Garder l'API éveillée »."
            exit 1
          fi

          echo "::notice::Service en bonne santé (réveil ${reveil}s)."
