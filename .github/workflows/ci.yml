# Intégration continue : API, entrepôt, interface et parcours de bout en bout, en parallèle.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-back

    env:
      SECRET_KEY: cle-de-test-sans-valeur-en-production
      ENV: dev

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hanabi-back/requirements*.txt

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest tests/ -q

  # La même suite sur le moteur de la production : verrous de ligne, types et
  # contraintes que SQLite laisse passer
  api-postgresql:
    name: API sur PostgreSQL (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-back

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: hanabi
          POSTGRES_DB: hanabi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: cle-de-test-sans-valeur-en-production
      ENV: dev
      TEST_DATABASE_URL: postgresql://postgres:hanabi@localhost:5432/hanabi

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hanabi-back/requirements*.txt

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest tests/ -q

  # Le banc d'essai de la recherche avec son modèle. Ailleurs, sans modèle, ses
  # tests sont sautés ; ici RECHERCHE_EXIGEE interdit de les sauter
  recherche:
    name: Recherche par le sens (banc d'essai)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-back

    env:
      SECRET_KEY: cle-de-test-sans-valeur-en-production
      ENV: dev
      RECHERCHE_EXIGEE: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hanabi-back/requirements*.txt

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      # 120 Mo : téléchargés une fois par révision du modèle, pas à chaque exécution
      - uses: actions/cache@v4
        with:
          path: hanabi-back/var/modeles
          key: modele-${{ hashFiles('hanabi-back/app/plongement.py') }}

      - name: Telecharger le modele (revision figee, empreintes verifiees)
        run: python -m app.plongement

      - name: Banc d'essai et tests de la recherche
        run: python -m pytest tests/test_recherche.py tests/test_recherche_banc.py -v

      - name: Rapport
        run: python tests/recherche/banc.py

  entrepot:
    name: Entrepot (construit deux fois sur PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-dwh

    # PostgreSQL jetable : l'API y écrit son jeu de démonstration, l'entrepôt s'y construit
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: hanabi
          POSTGRES_DB: hanabi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DWH_DATABASE_URL: postgresql://postgres:hanabi@localhost:5432/hanabi

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            hanabi-dwh/requirements.txt
            hanabi-back/requirements.txt

      - name: Installer les dependances
        run: pip install -r requirements.txt

      # Compile le Jinja et résout le graphe
      - name: Verification du projet dbt
        run: dbt parse --profiles-dir . --project-dir .

      # Charge les définitions Dagster à partir du manifeste produit ci-dessus
      - name: Verification du graphe Dagster
        run: dagster definitions validate

      # Verdicts des contrôles de volume et de fraîcheur, sans base
      - name: Tests des controles
        run: python -m unittest discover -s tests/orchestration

      # Dépendances de l'API à part, comme en local
      - name: Installer l'API
        run: |
          python -m venv "$RUNNER_TEMP/api"
          "$RUNNER_TEMP/api/bin/pip" install -r ../hanabi-back/requirements.txt

      # Démarrage de l'API sans serveur : migrations, catalogue et jeu de démonstration
      - name: Remplir la base
        working-directory: hanabi-back
        env:
          DATABASE_URL: postgresql://postgres:hanabi@localhost:5432/hanabi
          SECRET_KEY: cle-de-test-sans-valeur-en-production
          ENV: dev
          DEMO_USERS: "20000"
          OUTBOX_INTERVALLE_SECONDES: "0"
        run: |
          "$RUNNER_TEMP/api/bin/python" - <<'EOF'
          import asyncio
          from app.main import app, lifespan

          async def demarrer():
              async with lifespan(app):
                  pass

          asyncio.run(demarrer())
          EOF

      # Tout l'historique ; la construction planifiée ne recharge que le mois en cours
      - name: Charger les sources externes
        run: python -m ingestion.sources tout

      - name: Construction complete
        run: |
          dagster asset materialize --module-name orchestration --select '*' \
            --partition "$(date -u +%Y-%m-01)"

      # Second passage sur les tables construites : les modèles incrémentaux ne
      # recalculent que leur fenêtre, et chaque test doit passer de nouveau
      - name: Construction incrementale
        run: |
          dagster asset materialize --module-name orchestration --select '*' \
            --partition "$(date -u +%Y-%m-01)"

  front:
    name: Interface (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-front

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hanabi-front/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verification du formatage
        run: npm run format:check

      # contrat-tarification.test.js lit hanabi-back/app/pricing.py : dépôt complet requis
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Parcours de bout en bout (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hanabi-back/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hanabi-front/package-lock.json

      - name: Installer l'API
        run: pip install -r hanabi-back/requirements.txt

      - name: Installer l'interface
        run: npm ci
        working-directory: hanabi-front

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
        working-directory: hanabi-front

      # Python du système en CI, pas le venv local
      - name: Parcours de bout en bout
        run: npm run e2e
        working-directory: hanabi-front
        env:
          PYTHON: python

      - name: Conserver les traces en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: hanabi-front/test-results/
          retention-days: 7
