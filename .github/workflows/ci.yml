# Intégration continue : API, entrepôt, interface et parcours de bout en bout, en parallèle.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-back

    env:
      SECRET_KEY: cle-de-test-sans-valeur-en-production
      ENV: dev

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hanabi-back/requirements*.txt

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest tests/ -q

  entrepot:
    name: Entrepot (dbt parse + graphe Dagster)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-dwh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hanabi-dwh/requirements.txt

      - name: Installer les dependances
        run: pip install -r requirements.txt

      # Compile le Jinja et résout le graphe, sans connexion
      - name: Verification du projet dbt
        run: dbt parse --profiles-dir . --project-dir .

      # Charge les définitions Dagster à partir du manifeste produit ci-dessus
      - name: Verification du graphe Dagster
        run: dagster definitions validate

      # Verdicts des contrôles de volume et de fraîcheur, sans base
      - name: Tests des controles
        run: python -m unittest discover -s tests/orchestration

  front:
    name: Interface (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-front

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hanabi-front/package-lock.json

      - name: Installer les dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verification du formatage
        run: npm run format:check

      # contrat-tarification.test.js lit hanabi-back/app/pricing.py : dépôt complet requis
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Parcours de bout en bout (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hanabi-back/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hanabi-front/package-lock.json

      - name: Installer l'API
        run: pip install -r hanabi-back/requirements.txt

      - name: Installer l'interface
        run: npm ci
        working-directory: hanabi-front

      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
        working-directory: hanabi-front

      # Python du système en CI, pas le venv local
      - name: Parcours de bout en bout
        run: npm run e2e
        working-directory: hanabi-front
        env:
          PYTHON: python

      - name: Conserver les traces en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: hanabi-front/test-results/
          retention-days: 7
