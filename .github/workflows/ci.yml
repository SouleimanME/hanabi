# Integration continue : tests de l'API, puis lint et build de l'interface.
#
# Les deux projets sont independants, donc les deux taches tournent en parallele
# et un echec de l'une n'attend pas l'autre.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  api:
    name: API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-back

    env:
      # L'API refuse de demarrer sans cle quand ENV=prod ; en test on reste en
      # "dev", mais une cle fixe evite que chaque execution en tire une nouvelle.
      SECRET_KEY: cle-de-test-sans-valeur-en-production
      ENV: dev

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hanabi-back/requirements*.txt

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest tests/ -q

  entrepot:
    name: Entrepot (dbt parse + graphe Dagster)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-dwh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hanabi-dwh/requirements.txt

      - name: Installer les dependances
        run: pip install -r requirements.txt

      # `parse` compile tout le Jinja et resout le graphe de dependances sans
      # ouvrir de connexion : une reference cassee, une macro mal ecrite ou un
      # test declare sur une colonne qui n'existe pas echouent ici. Construire
      # reellement demanderait une base et des identifiants de production, ce
      # qu'on ne met pas dans l'integration continue de chaque branche.
      - name: Verification du projet dbt
        run: dbt parse --profiles-dir . --project-dir .

      # Meme idee un cran plus haut : charge les definitions Dagster et resout
      # le graphe, sans base ni execution. `dbt parse` ne voit rien de ce qui
      # vit dans `orchestration/` - un import casse, un traducteur qui produit
      # deux fois la meme clef d'actif, un calendrier qui vise un travail
      # renomme, une ressource `dbt` absente. Autant de pannes qui
      # n'apparaitraient qu'a 5 h du matin, dans la seule tache que personne ne
      # regarde. L'etape suit `dbt parse`, dont elle reprend le manifeste.
      - name: Verification du graphe Dagster
        run: dagster definitions validate

  front:
    name: Interface (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hanabi-front

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hanabi-front/package-lock.json

      # `npm ci` installe exactement les versions du package-lock : le build de
      # l'integration continue est identique au build local.
      - name: Installer les dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verification du formatage
        run: npm run format:check

      # Attention si l'on optimise un jour cette tache : `src/tests/contrat-tarification.test.js`
      # lit `hanabi-back/app/pricing.py` pour verifier que les deux piles
      # appliquent les memes frais de port. Elle a donc besoin du depot entier,
      # ce que `actions/checkout` fait par defaut. Un `sparse-checkout` limite a
      # `hanabi-front` rendrait ce test rouge sans qu'aucun code soit fautif.
      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: Parcours de bout en bout (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: hanabi-back/requirements*.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: hanabi-front/package-lock.json

      - name: Installer l'API
        run: pip install -r hanabi-back/requirements.txt

      - name: Installer l'interface
        run: npm ci
        working-directory: hanabi-front

      # `--with-deps` installe les bibliotheques systeme dont Chromium a besoin
      # sur une image nue. Sans elles, le navigateur se lance et meurt aussitot,
      # avec une erreur qui ne mentionne jamais la vraie cause.
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium
        working-directory: hanabi-front

      # `PYTHON` : l'integration continue installe les dependances dans son
      # propre environnement, sans le venv que la configuration cherche en local.
      - name: Parcours de bout en bout
        run: npm run e2e
        working-directory: hanabi-front
        env:
          PYTHON: python

      # Traces et captures du seul echec : de quoi rejouer le parcours image par
      # image sans avoir a le reproduire.
      - name: Conserver les traces en cas d'echec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: hanabi-front/test-results/
          retention-days: 7
